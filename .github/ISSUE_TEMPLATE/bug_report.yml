name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time — especially if you are doing this one-handed.

        **Please do not include real details about your child.** If reproducing the
        bug seems to need your data, just say so and we will work out a synthetic
        case together.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did the app do?
      placeholder: I tapped "Save feed" after switching sides, and only one entry appeared.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, list the taps. Even a rough sequence helps a lot.
      placeholder: |
        1. Open the app
        2. Tap Nursing, tap Start
        3. Wait a minute, tap "Switch to right side"
        4. Tap Save feed

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 14, Safari 18 — or Pixel 7, Chrome 130
    validations:
      required: true

  - type: dropdown
    id: installed
    attributes:
      label: How are you running it?
      options:
        - Installed to my home screen
        - In a browser tab
        - Locally with npm run dev
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Which theme were you in?
      description: Some bugs only show up in one palette.
      options:
        - Light
        - Dark
        - Night
        - Auto
        - Not sure
    validations:
      required: false

  - type: checkboxes
    id: data-loss
    attributes:
      label: Data
      options:
        - label: This bug lost or corrupted entries I had already logged
          required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots are very welcome — please crop out your child's name if you would rather not share it.
